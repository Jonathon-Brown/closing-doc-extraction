# mlx-lm LoRA config for the published adapter. Values match the run in
# RESULTS.md (adapters/adapter_config.json from that run, with paths made
# relative). Run from the repo root:  mlx_lm.lora --config lora_config.yaml
model: mlx-community/Qwen3-8B-4bit
train: true
data: work/finetune            # train.jsonl / valid.jsonl / test.jsonl from pipeline/
adapter_path: adapters
fine_tune_type: lora
num_layers: 16                 # LoRA on the top 16 transformer blocks
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
optimizer: adam
learning_rate: 1.0e-5
iters: 600                     # about 2.5 epochs over 242 training examples
batch_size: 1                  # batch 2 ran out of unified memory on a 36 GB Mac
grad_accumulation_steps: 1
grad_checkpoint: false
max_seq_length: 2048
mask_prompt: false
steps_per_report: 10
steps_per_eval: 200
val_batches: 25
save_every: 100
seed: 0
